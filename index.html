document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR')init();
});
document.addEventListener('keyup',e=>K[e.code]=false);

const PWR=['SMALL','BIG','FIRE'];
function hud(){
  document.getElementById('hScore').textContent=String(p1.score).padStart(6,'0');
  document.getElementById('hCoins').textContent='x'+String(p1.coins).padStart(2,'0');
  document.getElementById('hWorld').textContent=lv.name;
  document.getElementById('hTime').textContent=Math.ceil(timer);
  document.getElementById('hLives').textContent='x'+p1.lives;
  document.getElementById('hPower').textContent=PWR[p1.power]||'SMALL';
  document.getElementById('h2Score').textContent=String(p2.score).padStart(6,'0');
  document.getElementById('h2Coins').textContent='x'+String(p2.coins).padStart(2,'0');
  document.getElementById('h2Lives').textContent='x'+p2.lives;
  document.getElementById('h2Power').textContent=PWR[p2.power]||'SMALL';
}

function mkPlayer(x,y,num){
  return{x,y,w:26,h:36,vx:0,vy:0,onGround:false,jumping:false,bigJump:false,
    facing:1,wf:0,wt:0,invincible:0,dead:false,pipeTimer:0,
    num,power:0,score:0,coins:0,lives:3,fireCD:0,cpReached:false};
}

function moveX(e,solids){
  e.x+=e.vx;
  for(const s of solids){
    if(e.y+e.h<=s.y||e.y>=s.y+s.h||e.x+e.w<=s.x||e.x>=s.x+s.w)continue;
    const oL=e.x+e.w-s.x,oR=s.x+s.w-e.x;
    if(oL<oR){e.x=s.x-e.w;e.vx=e._bounce?-Math.abs(e.vx):0;}
    else{e.x=s.x+s.w;e.vx=e._bounce?Math.abs(e.vx):0;}
    return s;
  }
}
function moveY(e,solids){
  e.y+=e.vy;e.onGround=false;
  for(const s of solids){
    if(e.x+e.w<=s.x||e.x>=s.x+s.w||e.y+e.h<=s.y||e.y>=s.y+s.h)continue;
    const oT=e.y+e.h-s.y,oB=s.y+s.h-e.y;
    if(oT<oB){e.y=s.y-e.h;e.vy=0;e.onGround=true;}
    else{e.y=s.y+s.h;if(e.vy<0)e.vy=1;}
    return s;
  }
}
function overlap(a,b,px=3,py=2){
  return a.x+a.w>b.x+px&&a.x<b.x+b.w-px&&a.y+a.h>b.y+py&&a.y<b.y+b.h;
}

/* ── BUILD LEVEL ────────────────────────────────────────────────────────── */
function buildLevel(def){
  const solids=[],enemies=[],coinObjs=[],qblocks=[],pipes=[],checkpoints=[];
  const LW=def.LW,gt=def.gtype||'ground';

  // Ground
  for(let x=0;x<LW;x++){
    if(!def.pits?.some(([a,b])=>x>=a&&x<b)){
      for(let r=0;r<4;r++)solids.push({x:x*T,y:GY+r*T,w:T,h:T,type:gt});
    }
  }
  // Ceiling
  if(def.ceiling){
    for(let x=0;x<LW;x++)for(let r=0;r<2;r++)solids.push({x:x*T,y:r*T,w:T,h:T,type:'stone'});
    for(let y=2;y<14;y++){solids.push({x:0,y:y*T,w:T,h:T,type:'stone'});solids.push({x:(LW-1)*T,y:y*T,w:T,h:T,type:'stone'});}
  }
  // Bricks
  for(const[x,y]of(def.bricks||[]))solids.push({x:x*T,y:y*T,w:T,h:T,type:'brick'});
  // Extra stone platforms
  for(const[x,y]of(def.extraStone||[]))solids.push({x:x*T,y:y*T,w:T,h:T,type:'stone'});
  // Q blocks
  for(const[x,y,coins,hasPU]of(def.qdata||[])){
    const q={x:x*T,y:y*T,w:T,h:T,hit:false,bounceY:0,coins,hasPU};
    qblocks.push(q);
    solids.push({x:x*T,y:y*T,w:T,h:T,type:'qblock',ref:q});
  }
  // Pipes
  for(const p of(def.pipes||[])){
    const py=GY-p.h*T;
    const obj={x:p.tx*T,y:py,w:T*2,h:p.h*T,dest:p.dest,spawn:p.spawn,exit:p.exit||false};
    pipes.push(obj);
    solids.push({x:p.tx*T,y:py,w:T*2,h:p.h*T,type:'pipe',ref:obj});
  }
  // Auto coins on bricks
  for(const[x,y]of(def.bricks||[]))if(Math.random()>.6)coinObjs.push({x:x*T+16,y:y*T-20,collected:false,bob:Math.random()*Math.PI*2});
  // Ground coins
  for(let x=3;x<LW-2;x+=4)coinObjs.push({x:x*T+16,y:GY-22,collected:false,bob:Math.random()*Math.PI*2});

  // Enemies (ground)
  for(const[tx,type]of(def.enemies||[])){
    const eh=type==='koopa'||type==='koopa_fly'?36:30;
    const ew=type==='koopa'||type==='koopa_fly'?26:28;
    enemies.push({x:tx*T,y:GY-eh,w:ew,h:eh,vx:type==='koopa_fly'?0:-1.4,vy:0,
      onGround:false,alive:true,squished:false,squishTimer:0,wf:0,wt:0,
      type,shell:false,shellVx:0,hp:1,flyBase:GY-eh,initialized:false,_bounce:true});
  }
  // Piranha plants
  for(const[tx,ph]of(def.piranhas||[])){
    enemies.push({x:tx*T+4,baseY:GY-ph*T,y:GY,w:24,h:32,vx:0,vy:0,
      onGround:false,alive:true,squished:false,squishTimer:0,wf:0,wt:0,
      type:'piranha',timer:0,phase:0,hp:1});
  }
  // Bowser
  if(def.bowser){
    const bx=def.bowser[0]*T;
    enemies.push({x:bx,y:GY-64,w:56,h:64,vx:-1.5,vy:0,
      onGround:false,alive:true,squished:false,squishTimer:0,wf:0,wt:0,
      type:'bowser',hp:10,maxHp:10,fireCD:0,phaseTimer:120,phase:0,_bounce:false});
  }
  // Checkpoints
  for(const[cx]of(def.checkpoints||[]))checkpoints.push({x:cx*T,y:GY-T*6,reached:false});

  const flag=def.flag?{x:def.flag[0]*T,y:GY-T*9}:null;
  const axe=def.axe?{x:def.axe[0]*T,y:GY-T,w:T,h:T,active:true}:null;

  return{solids,enemies,coinObjs,qblocks,pipes,checkpoints,flag,axe,LW,name:def.name,bg:def.bg||'day'};
}

/* ── INIT ───────────────────────────────────────────────────────────────── */
function init(){
  worldIdx=0;cpX=0;
  particles=[];popups=[];coinAnims=[];fireballs=[];powerups=[];state='play';
  p1=mkPlayer(2*T,GY-50,1);
  p2=mkPlayer(3*T,GY-50,2);
  loadLevel('1-1');
}

function loadLevel(name,sx,sy){
  lv=buildLevel(DEFS[name]);
  fireballs=[];powerups=[];particles=[];popups=[];coinAnims=[];
  timer=400;timerTick=0;
  const spx=sx||2*T,spy=sy||GY-50;
  if(!p1.dead){p1.x=spx;p1.y=spy;p1.vx=0;p1.vy=0;p1.pipeTimer=0;p1.cpReached=false;}
  if(!p2.dead){p2.x=spx+T;p2.y=spy;p2.vx=0;p2.vy=0;p2.pipeTimer=0;p2.cpReached=false;}
  camX=Math.max(0,spx-W*.35);
  document.getElementById('overlay').style.display='none';
  state='play';hud();
}

function spawnPU(x,y,type){
  powerups.push({x,y,vy:0,vx:type==='mushroom'?1.5:0,w:T,h:T,type,alive:true});
}
function spawnPtcl(x,y,col,n=6){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i+Math.random()*.5;
    particles.push({x,y,vx:Math.cos(a)*(2+Math.random()*3),vy:Math.sin(a)*(2+Math.random()*3)-1,life:35,color:col,r:3+Math.random()*3});
  }
}
function popup(x,y,text,color){popups.push({x,y,text,color,life:45,vy:-1.5});}
function showOv(t,col,sub){const el=document.getElementById('overlay');el.style.display='block';el.style.color=col;el.innerHTML=`${t}<br><span style="font-size:18px;color:#fff">${sub}</span>`;}

/* ── UPDATE PLAYER ──────────────────────────────────────────────────────── */
function updPlayer(p,isP1){
  if(p.dead){
    p.vy+=GR;p.y+=p.vy;
    if(p.y>H+200){
      p.lives--;
      if(p1.lives<=0&&p2.lives<=0){state='gameover';showOv('GAME OVER','#f44','Press R');}
      else{p.x=cpX||2*T;p.y=GY-50;p.vx=0;p.vy=0;p.dead=false;p.invincible=120;}
      hud();
    }
    return;
  }
  if(p.invincible>0)p.invincible--;
  if(p.fireCD>0)p.fireCD--;

  let left,right,jump,down,fire;
  if(isP1){left=K.ArrowLeft;right=K.ArrowRight;jump=K.ArrowUp||K.KeyZ;down=K.ArrowDown;fire=K.KeyX;}
  else{left=K.KeyA;right=K.KeyD;jump=K.KeyW;down=K.KeyS;fire=K.KeyQ;}

  // Pipe
  if(down&&p.onGround&&p.pipeTimer===0){
    for(const pipe of lv.pipes){
      if(pipe.dest&&p.x+p.w>pipe.x+4&&p.x<pipe.x+pipe.w-4&&p.y+p.h>=pipe.y&&p.y+p.h<=pipe.y+T){
        p.pipeTimer=60;
        setTimeout(()=>loadLevel(pipe.dest,...(pipe.spawn||[3*T,GY-50])),500);
        return;
      }
      if(pipe.exit&&p.x+p.w>pipe.x+4&&p.x<pipe.x+pipe.w-4&&p.y+p.h>=pipe.y&&p.y+p.h<=pipe.y+T){
        p.pipeTimer=60;
        const prev=WORLDS[Math.max(0,worldIdx-1)];
        setTimeout(()=>loadLevel(prev||'1-1',...(pipe.spawn||[14*T,GY-50])),500);
        return;
      }
    }
  }
  if(p.pipeTimer>0){p.pipeTimer--;p.vy=2;p.y+=p.vy;return;}

  const spd=5.2,acc=p.onGround?.9:.4;
  if(right){p.vx=Math.min(p.vx+acc,spd);p.facing=1;}
  else if(left){p.vx=Math.max(p.vx-acc,-spd);p.facing=-1;}
  else p.vx*=p.onGround?.72:.9;

  const nh=p.power>=1?52:36;
  if(p.h!==nh){p.y-=(nh-p.h);p.h=nh;}

  if(jump&&p.onGround){p.vy=-13.5;p.onGround=false;p.jumping=true;p.bigJump=true;}
  if(p.bigJump&&!jump&&p.vy<-4)p.vy=-4;
  if(p.vy>=0){p.jumping=false;p.bigJump=false;}
  p.vy+=GR;

  moveX(p,lv.solids);
  p.onGround=false;
  const prevVy=p.vy;
  const hy=moveY(p,lv.solids);

  if(hy&&prevVy<0&&hy.type==='qblock'&&hy.ref&&!hy.ref.hit){
    const q=hy.ref;q.hit=true;q.bounceY=10;
    if(q.hasPU&&p.power===0){spawnPU(q.x,q.y-T,'mushroom');popup(q.x+16,q.y,'MUSHROOM!','#f80');}
    else if(q.hasPU&&p.power>=1){spawnPU(q.x,q.y-T,'fireflower');popup(q.x+16,q.y,'FIRE FLOWER!','#f80');}
    else{
      for(let i=0;i<q.coins;i++)coinAnims.push({x:q.x+16,y:q.y,vy:-8-i*1.5,life:40,color:'#ffd700'});
      p.coins+=q.coins;p.score+=q.coins*100;hud();spawnPtcl(q.x+16,q.y,'#ffd700',8);
    }
  }
  if(hy&&prevVy<0&&hy.type==='brick'&&p.power>=1){
    const idx=lv.solids.indexOf(hy);if(idx>=0)lv.solids.splice(idx,1);
    spawnPtcl(hy.x+16,hy.y+16,'#c87137',6);p.score+=50;hud();
  }

  p.x=Math.max(0,Math.min(p.x,lv.LW*T-p.w));
  if(p.y>H+80)killPlayer(p);

  for(const co of lv.coinObjs){
    if(co.collected)continue;
    if(Math.abs(p.x+13-co.x)<20&&Math.abs(p.y+p.h/2-co.y)<22){
      co.collected=true;p.coins++;p.score+=100;hud();
      spawnPtcl(co.x,co.y,'#ffd700',5);popup(co.x,co.y,'+100','#ffd700');
    }
  }

  for(const pu of powerups){
    if(!pu.alive)continue;
    if(p.x+p.w>pu.x&&p.x<pu.x+pu.w&&p.y+p.h>pu.y&&p.y<pu.y+pu.h){
      pu.alive=false;
      if(pu.type==='mushroom'&&p.power<1){p.power=1;p.score+=1000;popup(p.x+13,p.y,'SUPER!','#f0f');}
      else if(pu.type==='fireflower'&&p.power<2){p.power=2;p.score+=2000;popup(p.x+13,p.y,'FIRE!','#f80');}
      spawnPtcl(pu.x+16,pu.y+16,'#ff8',8);hud();
    }
  }

  if(p.invincible===0){
    for(const e of lv.enemies){
      if(!e.alive||e.squished)continue;
      if(e.type==='piranha'){if(e.phase===2&&overlap(p,e,2,2))hitPlayer(p);continue;}
      if(!overlap(p,e))continue;
      if(e.type==='bowser'){hitPlayer(p);continue;}
      const stomp=p.vy>1&&p.y+p.h<e.y+e.h*.6;
      if(stomp){
        if(e.type==='koopa'&&!e.shell){
          e.shell=true;e.squished=true;e.squishTimer=99999;e.h=20;e.y+=16;e.vx=0;e.shellVx=0;
          p.vy=-9;p.score+=200;hud();popup(e.x+13,e.y,'+200','#ff6');
        } else if(e.type==='koopa'&&e.shell){
          e.shellVx=e.x<p.x?-9:9;p.vy=-9;
        } else {
          e.squished=true;e.squishTimer=32;p.vy=-9;p.score+=200;hud();
          spawnPtcl(e.x+14,e.y+10,'#a1673a',6);popup(e.x+14,e.y,'+200','#ff6');
        }
      } else {
        if(e.shell&&e.shellVx===0){e.shellVx=p.facing*9;p.vy=-5;}
        else hitPlayer(p);
      }
    }
  }

  for(const cp of lv.checkpoints){
    if(!cp.reached&&p.x+p.w>cp.x&&p.x<cp.x+T){
      cp.reached=true;cpX=cp.x;popup(cp.x,cp.y,'CHECKPOINT!','#0f0');spawnPtcl(cp.x+16,cp.y,'#0f0',10);
    }
  }

  if(lv.axe&&lv.axe.active){
    const ax=lv.axe;
    if(p.x+p.w>ax.x&&p.x<ax.x+ax.w&&p.y+p.h>ax.y&&p.y<ax.y+ax.h){
      ax.active=false;
      for(const e of lv.enemies)if(e.type==='bowser'){e.alive=false;spawnPtcl(e.x+28,e.y+32,'#f44',20);}
      p.score+=5000;hud();
      setTimeout(()=>{state='win';showOv('BOWSER DEFEATED!','#ffd700',`Score: ${p1.score+p2.score} — Press R`);},800);
    }
  }

  if(lv.flag&&state==='play'&&p.x+p.w>lv.flag.x&&p.x<lv.flag.x+12&&p.y+p.h>lv.flag.y){
    p.score+=3000;hud();state='transition';
    worldIdx=Math.min(worldIdx+1,WORLDS.length-1);
    showOv('COURSE CLEAR!','#ffd700',`Score: ${p1.score+p2.score}`);
    setTimeout(()=>loadLevel(WORLDS[worldIdx]),2500);
  }

  if(fire&&p.power===2&&p.fireCD===0){
    p.fireCD=22;
    fireballs.push({x:p.x+(p.facing>0?p.w:0),y:p.y+p.h*.4,vx:p.facing*10,vy:2,alive:true,bounces:4,owner:p.num,r:7});
  }

  if(Math.abs(p.vx)>.4){p.wt++;if(p.wt>4){p.wf=(p.wf+1)%6;p.wt=0;}}else p.wf=0;
}

function hitPlayer(p){
  if(p.invincible>0)return;
  if(p.power>=1){p.power=Math.max(0,p.power-1);p.invincible=120;spawnPtcl(p.x+13,p.y+p.h/2,'#f44',8);hud();}
  else killPlayer(p);
}
function killPlayer(p){
  if(p.dead)return;
  p.dead=true;p.vy=-14;p.vx=0;p.power=0;spawnPtcl(p.x+13,p.y+p.h/2,'#e00',10);
}

/* ── UPDATE ENEMIES ─────────────────────────────────────────────────────── */
function updEnemies(){
  const alivePlayers=[p1,p2].filter(p=>!p.dead);
  function nearest(ex,ey){
    let best=null,bd=99999;
    for(const p of alivePlayers){const d=Math.hypot(p.x+p.w/2-ex,p.y+p.h/2-ey);if(d<bd){bd=d;best=p;}}
    return{p:best,d:bd};
  }

  for(const e of lv.enemies){
    if(!e.alive)continue;
    if(e.type==='bowser'){updBowser(e,alivePlayers);continue;}
    if(e.type==='piranha'){updPiranha(e);continue;}

    if(e.squished){
      if(e.squishTimer!==99999)e.squishTimer--;
      if(e.squishTimer<=0)e.alive=false;
      if(e.shell&&e.shellVx!==0){
        e.x+=e.shellVx;e.vy+=GR;moveY(e,lv.solids);
        for(const s of lv.solids){
          if(e.x+e.w>s.x&&e.x<s.x+s.w&&e.y+e.h>s.y&&e.y<s.y+s.h){
            const oL=e.x+e.w-s.x,oR=s.x+s.w-e.x;
            if(oL<oR){e.x=s.x-e.w;e.shellVx=-Math.abs(e.shellVx);}
            else{e.x=s.x+s.w;e.shellVx=Math.abs(e.shellVx);}
          }
        }
        for(const e2 of lv.enemies){
          if(e2===e||!e2.alive)continue;
          if(overlap(e,e2,0,0)){e2.alive=false;spawnPtcl(e2.x+14,e2.y+10,'#f80',5);p1.score+=300;p2.score+=300;hud();}
        }
        if(e.x<0||e.x>lv.LW*T)e.alive=false;
      }
      continue;
    }

    if(!e.initialized){e.flyBase=e.y;e.initialized=true;}
    const{p:target,d:dist}=nearest(e.x+e.w/2,e.y+e.h/2);
    const chaseRange=e.type==='koopa_fly'?300:240;
    const chasing=target&&dist<chaseRange;

    if(e.type==='koopa_fly'){
      if(chasing){
        const dx=(target.x+target.w/2)-(e.x+e.w/2);
        const dy=(target.y+target.h/2)-(e.y+e.h/2);
        e.vx+=(dx>0?.2:-.2);e.vy+=(dy>0?.15:-.15);
        e.vx=Math.max(-2.5,Math.min(2.5,e.vx));e.vy=Math.max(-3,Math.min(3,e.vy));
      } else {
        e.vx*=.96;e.vy+=Math.sin(Date.now()*.002)*.04;e.vy=Math.max(-1.5,Math.min(1.5,e.vy));
      }
      e.x+=e.vx;e.y+=e.vy;
      e.x=Math.max(T,Math.min(e.x,lv.LW*T-e.w-T));
      e.y=Math.max(T*2,Math.min(e.y,GY-e.h-T));
    } else {
      if(chasing){
        const dx=(target.x+target.w/2)-(e.x+e.w/2);
        e.vx=dx>0?(e.type==='koopa'?2.0:1.7):(e.type==='koopa'?-2.0:-1.7);
      } else {
        if(Math.abs(e.vx)<.1)e.vx=-1.4;
      }
      e.vy+=GR;
      e.x+=e.vx;
      for(const s of lv.solids){
        if(!['ground','brick','pipe','qblock','stone'].includes(s.type))continue;
        if(e.y+e.h<=s.y||e.y>=s.y+s.h||e.x+e.w<=s.x||e.x>=s.x+s.w)continue;
        const oL=e.x+e.w-s.x,oR=s.x+s.w-e.x;
        if(oL<oR){e.x=s.x-e.w;e.vx=-Math.abs(e.vx);}
        else{e.x=s.x+s.w;e.vx=Math.abs(e.vx);}
      }
      e.onGround=false;moveY(e,lv.solids);
      if(e.onGround&&!chasing){
        const px=e.vx>0?e.x+e.w+2:e.x-2;
        let floor=false;
        for(const s of lv.solids){
          if(!['ground','brick','stone'].includes(s.type))continue;
          if(px>=s.x&&px<s.x+s.w&&e.y+e.h+4>=s.y&&e.y+e.h<=s.y+s.h){floor=true;break;}
        }
        if(!floor)e.vx*=-1;
      }
      if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
      if(e.x+e.w>lv.LW*T){e.x=lv.LW*T-e.w;e.vx=-Math.abs(e.vx);}
      if(e.y>H+60)e.alive=false;
    }
    e.wt++;if(e.wt>6){e.wf=(e.wf+1)%2;e.wt=0;}
  }
}

function updPiranha(e){
  e.timer++;
  if(e.phase===0&&e.timer>90){e.phase=1;e.timer=0;}
  else if(e.phase===1){e.y-=1.5;if(e.y<=e.baseY){e.y=e.baseY;e.phase=2;e.timer=0;}}
  else if(e.phase===2&&e.timer>70){e.phase=3;e.timer=0;}
  else if(e.phase===3){e.y+=1.5;if(e.y>=e.baseY+e.h*3){e.phase=0;e.timer=0;}}
}

function updBowser(e,players){
  if(!e.alive)return;
  e.phaseTimer--;
  if(e.onGround&&e.phaseTimer<=0){
    e.phase=(e.phase+1)%3;
    e.phaseTimer=e.phase===0?150:e.phase===1?80:200;
    if(e.phase===1)e.vy=-14;
  }
  if(e.phase===2){e.fireCD--;if(e.fireCD<=0){e.fireCD=38;fireballs.push({x:e.x,y:e.y+e.h*.4,vx:-6,vy:0,alive:true,bounces:12,owner:-1,r:10,isBoss:true});}}
  const target=players[0];
  if(target&&e.phase!==1){e.vx=(target.x>e.x?1:- 1)*2;}
  e.vy+=GR;moveX(e,lv.solids);e.onGround=false;moveY(e,lv.solids);
  const minX=88*T;
  if(e.x<minX){e.x=minX;e.vx=Math.abs(e.vx);}
  if(e.x+e.w>lv.LW*T-T){e.x=lv.LW*T-T-e.w;e.vx=-Math.abs(e.vx);}
  e.wt++;if(e.wt>8){e.wf=(e.wf+1)%2;e.wt=0;}
}

/* ── FIREBALLS ───────────────────────────────────────────────────────────── */
function updFireballs(){
  for(let i=fireballs.length-1;i>=0;i--){
    const fb=fireballs[i];
    if(!fb.alive){fireballs.splice(i,1);continue;}
    fb.x+=fb.vx;fb.vy+=.6;fb.y+=fb.vy;
    for(const s of lv.solids){
      if(fb.x+fb.r>s.x&&fb.x-fb.r<s.x+s.w&&fb.y+fb.r>s.y&&fb.y-fb.r<s.y+s.h){
        if(fb.vy>0){fb.y=s.y-fb.r;fb.vy=-Math.abs(fb.vy)*.7;fb.bounces--;}
        else fb.alive=false;break;
      }
    }
    if(fb.bounces<=0||fb.x<0||fb.x>lv.LW*T||fb.y>H+40)fb.alive=false;
    if(fb.owner>0){
      for(const e of lv.enemies){
        if(!e.alive)continue;
        if(fb.x+fb.r>e.x&&fb.x-fb.r<e.x+e.w&&fb.y+fb.r>e.y&&fb.y-fb.r<e.y+e.h){
          if(e.type==='bowser'){
            e.hp--;fb.alive=false;spawnPtcl(e.x+28,e.y+20,'#f80',6);
            popup(e.x+28,e.y,'HP:'+e.hp,'#f80');
            if(e.hp<=0){e.alive=false;spawnPtcl(e.x+28,e.y+32,'#f44',20);const sc=fb.owner===1?p1:p2;sc.score+=8000;hud();state='win';showOv('BOWSER DEFEATED!','#ffd700',`Score: ${p1.score+p2.score} — Press R`);}
          } else {
            e.alive=false;fb.alive=false;spawnPtcl(e.x+14,e.y+10,'#f80',6);
            const sc=fb.owner===1?p1:p2;sc.score+=300;hud();popup(e.x+14,e.y,'+300','#f80');
          }
          break;
        }
      }
    }
    if(fb.owner===-1||fb.isBoss){
      for(const p of[p1,p2]){
        if(p.dead||p.invincible>0)continue;
        if(fb.x+fb.r>p.x&&fb.x-fb.r<p.x+p.w&&fb.y+fb.r>p.y&&fb.y-fb.r<p.y+p.h){hitPlayer(p);fb.alive=false;break;}
      }
    }
  }
}

/* ── POWERUP PHYSICS ────────────────────────────────────────────────────── */
function updPowerups(){
  for(const pu of powerups){
    if(!pu.alive)continue;
    if(pu.type==='mushroom'){
      pu.vy+=GR;pu.x+=pu.vx;
      for(const s of lv.solids){
        if(pu.x+pu.w>s.x&&pu.x<s.x+s.w&&pu.y+pu.h>s.y&&pu.y<s.y+s.h){
          const oL=pu.x+pu.w-s.x,oR=s.x+s.w-pu.x;
          if(oL<oR){pu.x=s.x-pu.w;pu.vx=-pu.vx;}else{pu.x=s.x+s.w;pu.vx=-pu.vx;}
        }
      }
      pu.y+=pu.vy;
      for(const s of lv.solids){
        if(pu.x+pu.w>s.x&&pu.x<s.x+s.w&&pu.y+pu.h>s.y&&pu.y<s.y+s.h){
          const oT=pu.y+pu.h-s.y,oB=s.y+s.h-pu.y;
          if(oT<oB){pu.y=s.y-pu.h;pu.vy=0;}else{pu.y=s.y+s.h;pu.vy=1;}
        }
      }
    }
    if(pu.y>H+40)pu.alive=false;
  }
}

let coinBob=0;
function updParticles(){
  coinBob+=.07;
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life--;if(p.life<=0)particles.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y+=p.vy;p.life--;if(p.life<=0)popups.splice(i,1);}
  for(let i=coinAnims.length-1;i>=0;i--){const a=coinAnims[i];a.y+=a.vy;a.vy+=.5;a.life--;if(a.life<=0)coinAnims.splice(i,1);}
}
function updTimer(){
  if(state!=='play'||p1.dead&&p2.dead)return;
  timerTick++;if(timerTick>=60){timerTick=0;timer=Math.max(0,timer-1);hud();}
  if(timer<=0){killPlayer(p1);killPlayer(p2);}
}
function updCam(){
  const t1=p1.dead?-99999:p1.x-W*.35;
  const t2=p2.dead?-99999:p2.x-W*.35;
  const tgt=Math.max(camX,Math.max(t1,t2));
  camX+=(tgt-camX)*.18;camX=Math.max(0,Math.min(camX,lv.LW*T-W));
}

/* ── DRAW ────────────────────────────────────────────────────────────────── */
function drawBG(){
  const bg=lv.bg;
  if(bg==='underground'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);return;}
  if(bg==='castle'){
    const sk=ctx.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#1a0000');sk.addColorStop(1,'#3d1000');
    ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
    // Lava in pits
    ctx.fillStyle='#ff2200';
    const t=Date.now()/400;
    for(const[a,b]of(DEFS['3-1'].pits||[])){
      const x1=a*T-camX,x2=b*T-camX;
      if(x2<0||x1>W)continue;
      const rx1=Math.max(0,x1),rx2=Math.min(W,x2);
      ctx.fillRect(rx1,GY,rx2-rx1,H-GY);
      ctx.fillStyle='rgba(255,100,0,.5)';
      for(let x=rx1;x<rx2;x+=4)ctx.fillRect(x,GY,4,5+Math.sin(x*.1+t)*3);
      ctx.fillStyle='#ff2200';
    }
    return;
  }
  if(bg==='desert'){
    const sk=ctx.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#e8b86d');sk.addColorStop(.5,'#f5d08a');sk.addColorStop(1,'#c87830');
    ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff8b0';ctx.shadowColor='#ffe000';ctx.shadowBlur=40;
    ctx.beginPath();ctx.arc(W-80-camX*.04,55,30,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#c68d3a';
    for(const[ox,rx]of[[-camX*.1,90],[-camX*.12+220,110],[-camX*.1+500,95],[-camX*.12+800,105],[-camX*.1+1200,88],[-camX*.12+1600,100],[-camX*.1+2100,92],[-camX*.12+2700,108]]){
      if(ox+rx*2<0||ox-rx>W)continue;
      ctx.beginPath();ctx.ellipse(ox,GY,rx,rx*.5,0,Math.PI,0);ctx.fill();
    }
    ctx.fillStyle='#2d7a2d';
    for(const ox of[-camX*.14+180,-camX*.14+450,-camX*.14+820,-camX*.14+1300,-camX*.14+1800,-camX*.14+2400]){
      if(ox<-30||ox>W+30)continue;
      ctx.fillRect(ox-4,GY-45,8,45);ctx.fillRect(ox-18,GY-30,14,7);ctx.fillRect(ox-18,GY-37,7,10);ctx.fillRect(ox+4,GY-25,14,7);ctx.fillRect(ox+11,GY-32,7,9);
    }
    return;
  }
  // Day
  const sk=ctx.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#2980b9');sk.addColorStop(1,'#87ceeb');
  ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#ffec00';ctx.shadowBlur=30;ctx.fillStyle='#ffd700';
  ctx.beginPath();ctx.arc(W-100-camX*.05,60,28,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore();
  ctx.fillStyle='#2ecc71';
  for(const[ox,rx,ry]of[[-camX*.12,70,50],[-camX*.12+180,90,65],[-camX*.12+420,80,55],[-camX*.12+700,95,70],[-camX*.12+980,75,55],[-camX*.12+1300,88,60],[-camX*.12+1700,80,58],[-camX*.12+2200,90,65],[-camX*.12+2800,75,55]]){
    if(ox+rx*2<0||ox-rx>W)continue;ctx.beginPath();ctx.ellipse(ox,GY,rx,ry*.6,0,Math.PI,0);ctx.fill();
  }
  for(const[ox,oy,sc]of[[-camX*.2+60,55,1.1],[-camX*.22+280,38,.85],[-camX*.2+560,65,1.3],[-camX*.18+820,45,1.0],[-camX*.2+1100,58,.9],[-camX*.22+1450,40,1.2],[-camX*.2+1800,62,1.0],[-camX*.18+2400,48,1.1]]){
    const r=22*sc;ctx.fillStyle='rgba(255,255,255,.93)';
    ctx.beginPath();ctx.arc(ox,oy,r,0,Math.PI*2);ctx.arc(ox+r*1.1,oy-r*.55,r*1.25,0,Math.PI*2);ctx.arc(ox+r*2.5,oy,r*.9,0,Math.PI*2);ctx.arc(ox+r*1.1,oy+r*.65,r*1.1,0,Math.PI*2);ctx.fill();
  }
}

function drawTile(sx,sy,type){
  if(type==='ground'){
    ctx.fillStyle=lv.bg==='desert'?'#c9893c':'#c2803a';ctx.fillRect(sx,sy,T,T);
    ctx.fillStyle=lv.bg==='desert'?'#e8b86d':'#56c43a';ctx.fillRect(sx,sy,T,10);
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(sx+8,sy+14,7,2);ctx.fillRect(sx+18,sy+22,6,2);
  } else if(type==='brick'){
    ctx.fillStyle='#c87137';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#d4824a';ctx.fillRect(sx,sy,T,T/2-1);
    ctx.fillStyle='#aa5520';ctx.fillRect(sx,sy+T/2-1,T,2);ctx.fillRect(sx+T/2,sy,2,T/2-1);
    ctx.fillRect(sx+T/4,sy+T/2+1,2,T/2-1);ctx.fillRect(sx+T*3/4,sy+T/2+1,2,T/2-1);
  } else if(type==='stone'){
    ctx.fillStyle='#555';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#666';ctx.fillRect(sx,sy,T,T/2-1);
    ctx.fillStyle='#444';ctx.fillRect(sx,sy+T/2-1,T,2);ctx.fillRect(sx+T/2,sy,2,T/2-1);

  }

}

function drawQBlock(sx,sy,q){
  const bo=q.bounceY*.6;if(q.bounceY>0)q.bounceY=Math.max(0,q.bounceY-1.8);

  else{
    ctx.shadowColor='#ffa500';ctx.shadowBlur=8;ctx.fillStyle='#f5a623';ctx.fillRect(sx,by,T,T);
    ctx.fillStyle='#ffcb50';ctx.fillRect(sx,by,T,T/2);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('?',sx+T/2,by+T/2+1);ctx.strokeStyle='#c87600';ctx.lineWidth=2;ctx.strokeRect(sx,by,T,T);
  }
}

function drawPipe(p){
  const sx=p.x-camX;if(sx+p.w<0||sx>W)return;
  const entering=p.dest&&(
    (!p1.dead&&p1.x+p1.w>p.x+4&&p1.x<p.x+p.w-4&&p1.y+p1.h>=p.y&&p1.y+p1.h<=p.y+T)||
    (!p2.dead&&p2.x+p2.w>p.x+4&&p2.x<p.x+p.w-4&&p2.y+p2.h>=p.y&&p2.y+p2.h<=p.y+T)

  ctx.fillStyle='#2e7d32';ctx.fillRect(sx,p.y,p.w,T);ctx.fillStyle='#43a047';ctx.fillRect(sx+2,p.y,p.w-4,9);

}

function drawSolids(){
  for(const s of lv.solids){
    const sx=s.x-camX;if(sx+s.w<-2||sx>W+2)continue;
    if(s.type==='qblock')drawQBlock(sx,s.y,s.ref);

}

function drawPlayer(p){
  if(p.dead&&p.y>H+80)return;
  if(p.invincible>0&&Math.floor(p.invincible/3)%2===1)return;
  const sx=p.x-camX;
  const isL=p.num===2;
  const hC=isL?'#388e3c':'#d32f2f',hD=isL?'#1b5e20':'#b71c1c';
  const sC=isL?'#388e3c':'#d32f2f',oC=isL?'#1565c0':'#1a5cb8';
  ctx.save();ctx.translate(sx+p.w/2,0);if(p.facing===-1)ctx.scale(-1,1);
  const ox=-p.w/2,y=p.y,w=p.w,h=p.h;
  if(!p.dead){ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(ox+w/2,GY+4,14,4,0,0,Math.PI*2);ctx.fill();}
  const lL=p.onGround?Math.sin(p.wf*Math.PI/3)*5:0;
  const lR=p.onGround?Math.sin(p.wf*Math.PI/3+Math.PI)*5:0;
  ctx.fillStyle='#2c1600';
  ctx.beginPath();ctx.roundRect(ox,y+h-11+lL,13,10,[4,4,2,2]);ctx.fill();
  ctx.beginPath();ctx.roundRect(ox+w-13,y+h-11+lR,13,10,[4,4,2,2]);ctx.fill();
  ctx.fillStyle=oC;ctx.fillRect(ox+3,y+h-22+lL*.5,9,13);ctx.fillRect(ox+w-12,y+h-22+lR*.5,9,13);
  const og=ctx.createLinearGradient(ox,y+h*.38,ox+w,y+h*.78);
  og.addColorStop(0,isL?'#1e88e5':'#2074d4');og.addColorStop(1,isL?'#1565c0':'#1558aa');
  ctx.fillStyle=og;ctx.beginPath();ctx.roundRect(ox+2,y+h*.38,w-4,h*.42,[4]);ctx.fill();
  ctx.fillStyle=sC;ctx.fillRect(ox+4,y+h*.34,w-8,h*.12);
  const as=p.onGround?Math.sin(p.wf*Math.PI/3)*8:0;
  ctx.fillStyle=sC;ctx.beginPath();ctx.roundRect(ox-5,y+h*.35+as,9,17,[3]);ctx.fill();ctx.beginPath();ctx.roundRect(ox+w-4,y+h*.35-as,9,17,[3]);ctx.fill();
  ctx.fillStyle='#f5c6b8';ctx.beginPath();ctx.arc(ox-.5,y+h*.35+16+as,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ox+w+.5,y+h*.35+16-as,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=oC;ctx.fillRect(ox+5,y+h*.28,5,h*.12);ctx.fillRect(ox+w-10,y+h*.28,5,h*.12);
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(ox+7,y+h*.28,3.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ox+w-8,y+h*.28,3.2,0,Math.PI*2);ctx.fill();
  if(p.power===2){
    ctx.save();ctx.globalAlpha=.2+Math.sin(Date.now()*.012)*.1;ctx.shadowColor='#f60';ctx.shadowBlur=20;ctx.strokeStyle='#f60';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ox+w/2,y+h/2,w*.85,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  ctx.fillStyle='#f5c6b8';ctx.fillRect(ox+8,y+h*.22,w-16,8);
  const fg=ctx.createRadialGradient(ox+w*.42,y+h*.13,1,ox+w*.45,y+h*.14,13);fg.addColorStop(0,'#fde3d5');fg.addColorStop(1,'#f5c6b8');
  ctx.fillStyle=fg;ctx.beginPath();ctx.ellipse(ox+w*.48,y+h*.16,12.5,11.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hC;ctx.beginPath();ctx.roundRect(ox+2,y+h*.05,w-4,10,[5,5,0,0]);ctx.fill();ctx.fillRect(ox-2,y+h*.1,w+4,5);ctx.fillStyle=hD;ctx.fillRect(ox+2,y+h*.05,5,10);
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(ox+w*.63,y+h*.175,2.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox+w*.63+1,y+h*.175-1,1.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8a090';ctx.beginPath();ctx.ellipse(ox+w*.61,y+h*.21,4.5,3.5,.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3d1c00';ctx.beginPath();ctx.ellipse(ox+w*.48-3,y+h*.235,6.5,4.5,-.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(ox+w*.48+3,y+h*.235,6.5,4.5,.2,0,Math.PI*2);ctx.fill();
  if(isL){ctx.fillStyle='#7fff00';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('P2',ox+w/2,y-4);}
  ctx.restore();
}

function drawFX(){
  for(const p of particles){ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-camX,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of popups){ctx.globalAlpha=Math.min(1,p.life/50);ctx.fillStyle=p.color;ctx.font='bold 15px monospace';ctx.fillText(p.text,p.x-camX,p.y);}
  ctx.globalAlpha=1;
}

/* ── MAIN LOOP ───────────────────────────────────────────────────────────── */
function loop(){
  ctx.clearRect(0,0,W,H);
  if(state==='play'||state==='transition'){
    updPlayer(p1,true);updPlayer(p2,false);
    updEnemies();updFireballs();updPowerups();updParticles();updTimer();updCam();
  }
  drawBG();drawSolids();drawCoinsAll();drawCheckpoints();drawFlag();drawAxe();
  for(const e of lv.enemies){
    if(e.type==='goomba')drawGoomba(e);
    else if(e.type==='koopa'||e.type==='koopa_fly')drawKoopa(e);
    else if(e.type==='piranha')drawPiranha(e);
    else if(e.type==='bowser')drawBowser(e);
  }
  drawPowerups();drawFireballs();drawPlayer(p1);drawPlayer(p2);drawFX();
  // Player position indicators
  if(!p1.dead){
    const px=Math.max(12,Math.min(p1.x-camX,W-24));
    ctx.fillStyle='rgba(220,50,50,.8)';ctx.fillRect(px-10,2,22,9);
    ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('P1',px,8);
  }
  if(!p2.dead){
    const px=Math.max(12,Math.min(p2.x-camX,W-24));
    ctx.fillStyle='rgba(50,200,50,.8)';ctx.fillRect(px-10,12,22,9);
    ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('P2',px,18);
  }
  requestAnimationFrame(loop);
}

init();loop();
</script>
</body>
</html>
